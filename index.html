<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Котики 🐱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff0f5 0%, #fce4ec 50%, #f3e5f5 100%);
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 { font-size: 2.8rem; color: #880e4f; margin-bottom: 8px; letter-spacing: 2px; }
    .subtitle { color: #ad1457; font-size: 1.1rem; margin-bottom: 40px; font-style: italic; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 960px;
      width: 100%;
    }
    .cat-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(136, 14, 79, 0.12);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .cat-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(136, 14, 79, 0.2);
    }
    .cat-info { padding: 16px 20px 20px; }
    .cat-name { font-size: 1.2rem; font-weight: bold; color: #4a148c; margin-bottom: 4px; }
    .cat-desc { font-size: 0.9rem; color: #7b6f80; font-style: italic; }
    .paw-row { margin-top: 48px; font-size: 2rem; letter-spacing: 8px; color: #ce93d8; }
    footer { margin-top: 24px; color: #ba68c8; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>🐱 Котики</h1>
  <p class="subtitle">самые милые создания на планете</p>
  <div class="gallery">

    <div class="cat-card">
      <div style="background:linear-gradient(135deg,#ffe0b2,#ffccbc);height:240px;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 200 180" width="180" height="180" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="100" cy="130" rx="55" ry="45" fill="#e67e22"/>
          <ellipse cx="100" cy="85" rx="42" ry="38" fill="#e67e22"/>
          <polygon points="68,60 58,30 85,52" fill="#e67e22"/>
          <polygon points="132,60 142,30 115,52" fill="#e67e22"/>
          <polygon points="70,58 62,36 83,53" fill="#f4a460"/>
          <polygon points="130,58 138,36 117,53" fill="#f4a460"/>
          <ellipse cx="100" cy="90" rx="28" ry="25" fill="#f5cba7"/>
          <ellipse cx="88" cy="82" rx="7" ry="8" fill="#27ae60"/>
          <ellipse cx="112" cy="82" rx="7" ry="8" fill="#27ae60"/>
          <ellipse cx="88" cy="83" rx="3" ry="5" fill="#1a1a1a"/>
          <ellipse cx="112" cy="83" rx="3" ry="5" fill="#1a1a1a"/>
          <circle cx="90" cy="81" r="1.5" fill="white"/>
          <circle cx="114" cy="81" r="1.5" fill="white"/>
          <ellipse cx="100" cy="94" rx="4" ry="3" fill="#e74c3c"/>
          <line x1="70" y1="94" x2="95" y2="96" stroke="#888" stroke-width="1.5"/>
          <line x1="70" y1="100" x2="95" y2="99" stroke="#888" stroke-width="1.5"/>
          <line x1="130" y1="94" x2="105" y2="96" stroke="#888" stroke-width="1.5"/>
          <line x1="130" y1="100" x2="105" y2="99" stroke="#888" stroke-width="1.5"/>
          <path d="M96 97 Q100 102 104 97" stroke="#c0392b" stroke-width="1.5" fill="none"/>
          <ellipse cx="75" cy="165" rx="18" ry="12" fill="#e67e22"/>
          <ellipse cx="125" cy="165" rx="18" ry="12" fill="#e67e22"/>
          <path d="M155 140 Q185 110 170 80 Q165 65 155 75 Q163 90 160 110 Q152 130 148 142" fill="#e67e22"/>
        </svg>
      </div>
      <div class="cat-info">
        <div class="cat-name">Рыжик</div>
        <div class="cat-desc">Любит греться на солнышке и мурлыкать</div>
      </div>
    </div>

    <div class="cat-card">
      <div style="background:linear-gradient(135deg,#e8eaf6,#c5cae9);height:240px;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 200 180" width="180" height="180" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="100" cy="130" rx="55" ry="45" fill="#95a5a6"/>
          <ellipse cx="100" cy="85" rx="42" ry="38" fill="#95a5a6"/>
          <polygon points="68,60 58,30 85,52" fill="#95a5a6"/>
          <polygon points="132,60 142,30 115,52" fill="#95a5a6"/>
          <polygon points="70,58 62,36 83,53" fill="#ecb7be"/>
          <polygon points="130,58 138,36 117,53" fill="#ecb7be"/>
          <ellipse cx="100" cy="90" rx="28" ry="25" fill="#bdc3c7"/>
          <path d="M82 83 Q88 78 94 83" stroke="#555" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M106 83 Q112 78 118 83" stroke="#555" stroke-width="2" fill="none" stroke-linecap="round"/>
          <ellipse cx="100" cy="94" rx="4" ry="3" fill="#e74c3c"/>
          <line x1="70" y1="94" x2="95" y2="96" stroke="#777" stroke-width="1.5"/>
          <line x1="70" y1="100" x2="95" y2="99" stroke="#777" stroke-width="1.5"/>
          <line x1="130" y1="94" x2="105" y2="96" stroke="#777" stroke-width="1.5"/>
          <line x1="130" y1="100" x2="105" y2="99" stroke="#777" stroke-width="1.5"/>
          <path d="M96 97 Q100 102 104 97" stroke="#c0392b" stroke-width="1.5" fill="none"/>
          <ellipse cx="75" cy="165" rx="18" ry="12" fill="#95a5a6"/>
          <ellipse cx="125" cy="165" rx="18" ry="12" fill="#95a5a6"/>
          <path d="M155 140 Q185 110 170 80 Q165 65 155 75 Q163 90 160 110 Q152 130 148 142" fill="#7f8c8d"/>
          <text x="150" y="50" font-size="18" fill="#7f8c8d" font-family="Georgia">z</text>
          <text x="162" y="36" font-size="14" fill="#95a5a6" font-family="Georgia">z</text>
          <text x="172" y="25" font-size="10" fill="#bdc3c7" font-family="Georgia">z</text>
        </svg>
      </div>
      <div class="cat-info">
        <div class="cat-name">Серёжа</div>
        <div class="cat-desc">Задумчивый философ и знаток рыбы</div>
      </div>
    </div>

    <div class="cat-card">
      <div style="background:linear-gradient(135deg,#f3e5f5,#e1bee7);height:240px;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 200 180" width="180" height="180" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="100" cy="130" rx="55" ry="45" fill="#f5f5f5"/>
          <ellipse cx="100" cy="85" rx="42" ry="38" fill="#f5f5f5"/>
          <polygon points="68,60 58,30 85,52" fill="#f5f5f5"/>
          <polygon points="132,60 142,30 115,52" fill="#f5f5f5"/>
          <polygon points="70,58 62,36 83,53" fill="#f8bbd0"/>
          <polygon points="130,58 138,36 117,53" fill="#f8bbd0"/>
          <ellipse cx="100" cy="90" rx="28" ry="25" fill="white"/>
          <ellipse cx="88" cy="82" rx="7" ry="8" fill="#29b6f6"/>
          <ellipse cx="112" cy="82" rx="7" ry="8" fill="#29b6f6"/>
          <ellipse cx="88" cy="83" rx="3" ry="5" fill="#1a1a1a"/>
          <ellipse cx="112" cy="83" rx="3" ry="5" fill="#1a1a1a"/>
          <circle cx="90" cy="81" r="1.5" fill="white"/>
          <circle cx="114" cy="81" r="1.5" fill="white"/>
          <ellipse cx="100" cy="94" rx="4" ry="3" fill="#f48fb1"/>
          <line x1="70" y1="94" x2="95" y2="96" stroke="#aaa" stroke-width="1.5"/>
          <line x1="70" y1="100" x2="95" y2="99" stroke="#aaa" stroke-width="1.5"/>
          <line x1="130" y1="94" x2="105" y2="96" stroke="#aaa" stroke-width="1.5"/>
          <line x1="130" y1="100" x2="105" y2="99" stroke="#aaa" stroke-width="1.5"/>
          <path d="M96 97 Q100 102 104 97" stroke="#e91e63" stroke-width="1.5" fill="none"/>
          <ellipse cx="75" cy="165" rx="18" ry="12" fill="#f0f0f0"/>
          <ellipse cx="125" cy="165" rx="18" ry="12" fill="#f0f0f0"/>
          <path d="M155 140 Q185 110 170 80 Q165 65 155 75 Q163 90 160 110 Q152 130 148 142" fill="#eeeeee"/>
          <polygon points="85,48 90,35 95,45 100,32 105,45 110,35 115,48" fill="#ffd700" stroke="#f9a825" stroke-width="1"/>
          <circle cx="100" cy="32" r="3" fill="#e53935"/>
          <circle cx="90" cy="36" r="2" fill="#1565c0"/>
          <circle cx="110" cy="36" r="2" fill="#2e7d32"/>
        </svg>
      </div>
      <div class="cat-info">
        <div class="cat-name">Снежок</div>
        <div class="cat-desc">Пушистый, мягкий и очень важный</div>
      </div>
    </div>

  </div>
  <div class="paw-row">🐾 🐾 🐾</div>
  <footer>сделано с любовью к котикам ♥</footer>
</body>
</html>
